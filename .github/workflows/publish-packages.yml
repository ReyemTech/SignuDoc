name: Publish SignuDoc packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-signudoc-packages
  queue: max

jobs:
  publish:
    if: github.repository == 'ReyemTech/SignuDoc' && (github.event_name != 'push' || !github.event.deleted)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      packages: write
    env:
      APP_IMAGE: ghcr.io/reyemtech/signudoc
      MIGRATION_IMAGE: ghcr.io/reyemtech/signudoc-migrate
      CHART_REGISTRY: oci://ghcr.io/reyemtech/charts
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v4.2.3
      - uses: oras-project/setup-oras@v2.0.3 # immutable release (2026-10-27)
        with:
          version: 1.3.6
      - name: Plan release and package the chart
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          commit=$(git rev-parse HEAD)
          app_version=$(jq -er '.version' package.json)
          release_tag="v$app_version"

          if response=$(gh api --include "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" 2>&1); then
            version_tag_exists=true
          else
            if [[ $response == *"HTTP/2.0 404"* || $response == *"HTTP/1.1 404"* ]]; then
              version_tag_exists=false
            else
              printf 'Could not determine whether %s exists:\n%s\n' "$release_tag" "$response" >&2
              exit 1
            fi
          fi

          if response=$(gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$release_tag" 2>&1); then
            release_exists=true
          else
            if [[ $response == *"HTTP/2.0 404"* || $response == *"HTTP/1.1 404"* ]]; then
              release_exists=false
            else
              printf 'Could not determine whether release %s exists:\n%s\n' "$release_tag" "$response" >&2
              exit 1
            fi
          fi

          export COMMIT="$commit" APP_VERSION="$app_version" VERSION_TAG_EXISTS="$version_tag_exists" RELEASE_EXISTS="$release_exists"
          COMMIT="$commit" APP_VERSION="$app_version" VERSION_TAG_EXISTS="$version_tag_exists" RELEASE_EXISTS="$release_exists" \
            node --input-type=module -e '
              import { writeFileSync } from "node:fs";
              import { planPackageRelease } from "./deploy/reyemtech/package-release-plan.mjs";
              const plan = planPackageRelease({
                refType: process.env.REF_TYPE,
                refName: process.env.REF_NAME,
                commit: process.env.COMMIT,
                appVersion: process.env.APP_VERSION,
                versionTagExists: process.env.VERSION_TAG_EXISTS === "true",
                releaseExists: process.env.RELEASE_EXISTS === "true",
              });
              writeFileSync(process.env.RUNNER_TEMP + "/release-plan.json", JSON.stringify(plan));
              console.log(JSON.stringify(plan));
            '
          plan="$RUNNER_TEMP/release-plan.json"
          chart_version=$(jq -er '.chartVersion' "$plan")
          chart_latest=$(jq -r '.chartLatestTag // empty' "$plan")
          release_tag=$(jq -er '.releaseTag' "$plan")
          create_release=$(jq -er '.createRelease' "$plan")
          image_tags=$(jq -er '.imageTags | join("\n")' "$plan")

          node charts/signudoc/tests/validate.mjs
          package_mode=snapshot
          if [[ $chart_version == "$app_version" ]]; then package_mode=stable; fi
          archive_version=$(bash deploy/reyemtech/package-chart.sh "$commit" "$REF_TYPE" "$REF_NAME" "$RUNNER_TEMP" "$package_mode")
          if [[ $archive_version != "$chart_version" ]]; then
            echo "Planner/chart packaging mismatch: $chart_version != $archive_version" >&2
            exit 1
          fi
          archive="$RUNNER_TEMP/signudoc-$chart_version.tgz"
          helm lint "$archive" -f deploy/reyemtech/workload/values.yaml
          helm template signudoc "$archive" -f deploy/reyemtech/workload/values.yaml >/dev/null
          {
            echo "COMMIT=$commit"
            echo "APP_VERSION=$app_version"
            echo "RELEASE_TAG=$release_tag"
            echo "CHART_VERSION=$chart_version"
            echo "CHART_LATEST_TAG=$chart_latest"
            echo "CREATE_RELEASE=$create_release"
            echo "IMAGE_TAGS<<EOF"
            echo "$image_tags"
            echo "EOF"
            echo "CHART_ARCHIVE=$archive"
          } >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.37.2
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Log Helm and ORAS in to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$GHCR_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Check existing immutable packages
        id: existing
        run: |
          inspect_digest() {
            local ref=$1 result
            if result=$(docker buildx imagetools inspect "$ref" --raw 2>&1); then
              jq -er '.config.digest // .manifests[0].digest // empty' <<< "$result"
            elif [[ $result == "ERROR: $ref: not found" ]]; then
              return 1
            else
              printf 'Could not inspect %s: %s\n' "$ref" "$result" >&2
              return 2
            fi
          }
          chart_ref="${CHART_REGISTRY#oci://}/signudoc:$CHART_VERSION"
          if chart_manifest=$(docker buildx imagetools inspect "$chart_ref" --raw 2>&1); then
            existing=$(mktemp -d)
            trap 'rm -rf -- "$existing"' EXIT
            helm pull "$CHART_REGISTRY/signudoc" --version "$CHART_VERSION" --destination "$existing"
            python3 deploy/reyemtech/compare-chart-archives.py "$CHART_ARCHIVE" "$existing/signudoc-$CHART_VERSION.tgz"
            echo "chart=true" >> "$GITHUB_OUTPUT"
          elif [[ $chart_manifest == "ERROR: $chart_ref: not found" ]]; then
            echo "chart=false" >> "$GITHUB_OUTPUT"
          else
            printf 'Could not inspect chart %s: %s\n' "$chart_ref" "$chart_manifest" >&2
            exit 1
          fi
          for name in app migration; do
            if [[ $name == app ]]; then image=$APP_IMAGE; else image=$MIGRATION_IMAGE; fi
            if inspect_digest "$image:$COMMIT" >/dev/null; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              rc=$?
              if [[ $rc -ne 1 ]]; then exit "$rc"; fi
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          done
      - name: Publish the app image
        if: steps.existing.outputs.app == 'false'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runner
          platforms: linux/amd64
          build-args: NEXT_DEPLOYMENT_ID=${{ env.COMMIT }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT }}
          tags: ${{ env.APP_IMAGE }}:${{ env.COMMIT }}
          provenance: mode=max
          sbom: true
          push: true
      - name: Publish the migration image
        if: steps.existing.outputs.migration == 'false'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: migrate
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT }}
          tags: ${{ env.MIGRATION_IMAGE }}:${{ env.COMMIT }}
          provenance: mode=max
          sbom: true
          push: true
      - name: Verify images and publish immutable version tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for image in "$APP_IMAGE" "$MIGRATION_IMAGE"; do
            manifest=$(docker buildx imagetools inspect "$image:$COMMIT" --format '{{json .Manifest}}')
            digest=$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<< "$manifest")
            platform_digest=$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' <<< "$manifest")
            docker buildx imagetools inspect "$image@$platform_digest" --format '{{json .Image}}' |
              jq -e --arg commit "$COMMIT" '.config.Labels["org.opencontainers.image.revision"] == $commit'

            while IFS= read -r tag; do
              [[ -n $tag && $tag != "$COMMIT" ]] || continue
              [[ $tag != latest ]] || continue
              target="$image:$tag"
              if existing=$(docker buildx imagetools inspect "$target" --format '{{json .Manifest}}' 2>&1); then
                existing_digest=$(jq -er '.digest' <<< "$existing")
                [[ $existing_digest == "$digest" ]] || { echo "Refusing to move immutable tag $target" >&2; exit 1; }
              else
                if [[ $existing != "ERROR: $target: not found" ]]; then
                  printf 'Could not inspect image tag %s: %s\n' "$target" "$existing" >&2
                  exit 1
                fi
                docker buildx imagetools create --tag "$target" "$image@$digest"
              fi
              echo "$target -> $digest" | tee -a "$GITHUB_STEP_SUMMARY"
            done <<< "$IMAGE_TAGS"
          done
      - name: Publish the OCI chart
        if: steps.existing.outputs.chart == 'false'
        run: helm push "$CHART_ARCHIVE" "$CHART_REGISTRY"
      - name: Verify the published OCI chart
        run: |
          verified=$(mktemp -d)
          trap 'rm -rf -- "$verified"' EXIT
          chart_ref="$CHART_REGISTRY/signudoc"
          helm pull "$chart_ref" --version "$CHART_VERSION" --destination "$verified"
          pulled="$verified/signudoc-$CHART_VERSION.tgz"
          python3 deploy/reyemtech/compare-chart-archives.py "$CHART_ARCHIVE" "$pulled"
          helm show values "$pulled" | yq -o=json '.' |
            jq -e --arg app "$APP_IMAGE" --arg migration "$MIGRATION_IMAGE" --arg commit "$COMMIT" \
              '.image.repository == $app and .migration.image.repository == $migration and .image.tag == $commit and .migration.image.tag == $commit'
          test "$(helm show chart "$pulled" | yq -er '.version')" = "$CHART_VERSION"
          manifest=$(docker buildx imagetools inspect "${chart_ref#oci://}:$CHART_VERSION" --format '{{json .Manifest}}')
          digest=$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<< "$manifest")
      - name: Create GitHub Release
        if: env.CREATE_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" --target "$COMMIT" --generate-notes --title "$RELEASE_TAG"
      - name: Move main latest aliases
        if: env.CHART_LATEST_TAG != ''
        run: |
          for image in "$APP_IMAGE" "$MIGRATION_IMAGE"; do
            manifest=$(docker buildx imagetools inspect "$image:$COMMIT" --format '{{json .Manifest}}')
            digest=$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<< "$manifest")
            docker buildx imagetools create --tag "$image:latest" "$image@$digest"
            echo "$image:latest -> $digest" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          chart_ref="$CHART_REGISTRY/signudoc"
          chart_manifest=$(docker buildx imagetools inspect "${chart_ref#oci://}:$CHART_VERSION" --format '{{json .Manifest}}')
          chart_digest=$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<< "$chart_manifest")
          oras tag "${chart_ref}:$CHART_VERSION" latest
          echo "$chart_ref:latest -> $chart_digest (main build; Argo CD uses SemVer)" | tee -a "$GITHUB_STEP_SUMMARY"
