name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, unit tests, build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Poppler's pdfsig, so the seal tests check signatures the way a PDF
      # reader does instead of skipping that part.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: npm test
      # With nothing configured, as on a first deployment whose database
      # has not been connected yet: the build must not need any of it.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      # The functions that draw PDFs must ship the fonts they read, and not
      # the whole repository (issue #108).
      - run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-function-traces.ts

  e2e:
    name: Database and browser tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [24, 26]
    env:
      E2E_DATABASE_URL: postgres://signudoc:signudoc@127.0.0.1:5432/signudoc_e2e
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: signudoc
          POSTGRES_PASSWORD: signudoc
          POSTGRES_DB: signudoc_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signudoc -d signudoc_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Test database workflows and worker interruption
        run: npm run test:db
      - run: npx playwright install --with-deps chromium
      - name: Run the browser suite in legacy mode
        run: npm run test:e2e
      - name: Run the browser suite with durable recovery
        run: npm run test:e2e
        env:
          E2E_DURABLE_JOBS: "1"
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
